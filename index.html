*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}

header p{margin:0;color:#d4d4d4;max-width:60ch}
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
input[type=search]{font-family:inherit;width:100%;padding:12px 14px;font-size:1rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=search]:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--bg)}
.pic img{width:100%;height:100%;object-fit:contain}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.85rem;color:var(--muted)}
.name{font-weight:700;font-size:1.05rem;margin:0}
.desc{font-size:.92rem;color:var(--muted);margin:0;flex:1}
.price{font-size:1.4rem;font-weight:700;margin-top:6px}
.old{font-size:.85rem;color:var(--muted);text-decoration:line-through;font-weight:400;margin-left:6px}
.buy{display:block;text-align:center;background:var(--cta);color:var(--ctaink);text-decoration:none;font-weight:700;padding:12px;border-radius:10px;margin-top:8px}
.buy:hover{filter:brightness(.95)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.cupom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:2px dashed var(--cta);border-radius:14px;padding:14px 16px;margin-bottom:20px;background:var(--surface)}
.cupom h2{margin:0;font-size:1.05rem}
.cupom p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.cupom-cod{display:flex;align-items:center;gap:8px}
.cupom-cod code{font-family:inherit;font-weight:700;font-size:1.15rem;letter-spacing:.06em;border:2px solid var(--cta);color:var(--ink);padding:6px 12px;border-radius:8px}
.cupom-cod button{font-family:inherit;font-weight:700;background:var(--cta);color:var(--ctaink);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.estilo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.estilo label{font-weight:700}
.estilo select{font-family:inherit;font-size:1rem;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.app-aviso{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cta);color:#000;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.92rem}
.app-aviso span{flex:1;min-width:200px}
.app-aviso a{background:#000;color:#fff;font-weight:700;text-decoration:none;padding:8px 12px;border-radius:8px}
.app-aviso .copiar{background:#000;color:#fff;font-weight:700;font-size:.92rem;padding:8px 12px;border-radius:8px}
.app-aviso button{font:inherit;background:none;border:0;font-size:1.1rem;cursor:pointer;color:#000}
@media (max-width:480px){.pic{height:110px;font-size:3rem}.body{padding:10px}.name{font-size:.95rem}.desc{font-size:.82rem}.price{font-size:1.15rem}.old{display:block;margin:0}.buy{padding:10px;font-size:.9rem}}
</style>

});

const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cats = ["Todas","Motos","Bikes"];
let catAtiva = "Todas", termo = "", estiloAtivo = document.getElementById("estilo").value;

const chips = document.getElementById("chips");
const lista = document.getElementById("lista");
const vazio = document.getElementById("vazio");

function desenharChips(){
  chips.innerHTML = cats.map(c=>`<button class="chip" aria-pressed="${c===catAtiva}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function desenhar(){
  const t = termo.trim().toLowerCase();
  const itens = PRODUTOS.filter(p=>(!p.estilo||p.estilo===estiloAtivo)&&(catAtiva==="Todas"||p.cat===catAtiva)&&(p.nome+" "+p.desc).toLowerCase().includes(t));
  vazio.hidden = itens.length>0;
  lista.innerHTML = itens.map(p=>`
    <article class="card">
      <div class="pic">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.nome)}" loading="lazy">`:esc(p.emoji)}</div>
      <div class="body">
        <span class="cat">${esc(p.cat)}</span>
        <h2 class="name">${esc(p.nome)}</h2>
        <p class="desc">${esc(p.desc)}</p>
        <div class="price">${brl(p.preco)}${p.antigo?`<span class="old">${brl(p.antigo)}</span>`:""}</div>
        ${p.link?`<a class="buy" href="${esc(p.link)}" rel="sponsored noopener">Comprar no Mercado Livre</a>`:`<span class="buy" style="opacity:.5">Em breve</span>`}
      </div>
    </article>`).join("");
}
chips.addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  catAtiva = b.dataset.c; desenharChips(); desenhar();
});
document.getElementById("busca").addEventListener("input",e=>{termo=e.target.value;desenhar();});
document.getElementById("estilo").addEventListener("change",e=>{estiloAtivo=e.target.value;desenhar();});
/* Aviso para quem abre pelo TikTok, Instagram ou Facebook */
(function(){
  const ua = navigator.userAgent || "";
  const forcar = /[?&]aviso=1/.test(location.search);
  if(!forcar && !/musical_ly|BytedanceWebview|TikTok|Instagram|FBAN|FBAV|FB_IAB/i.test(ua)) return;
  const av = document.getElementById("aviso"); av.style.display = "flex";
  const android = /Android/i.test(ua);
  const url = location.origin + location.pathname;
  const txt = document.getElementById("avisoTxt");
  if(android){
    const b = document.getElementById("chromeBtn"); b.hidden = false;
    b.href = "intent://" + location.host + location.pathname + "#Intent;scheme=https;package=com.android.chrome;end";
    txt.textContent = "Para comprar com mais facilidade, abra no Chrome ou toque nos três pontinhos (⋯) e escolha “Abrir no navegador”.";
  }else{
    txt.textContent = "Para comprar com mais facilidade, toque nos três pontinhos (⋯) no canto superior e escolha “Abrir no navegador”. Ou copie o link e cole no Safari ou no Chrome.";
  }
  const cp = document.getElementById("copiarBtn"); cp.hidden = false;
  cp.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(url); }
    catch(e){ const t = document.createElement("textarea"); t.value = url; document.body.append(t); t.select(); try{ document.execCommand("copy"); }catch(_){} t.remove(); }
    cp.textContent = "Link copiado!"; setTimeout(()=>{ cp.textContent = "Copiar link"; },2500);
  };
  document.getElementById("avisoX").onclick = ()=>av.remove();
})();
desenharChips(); desenhar();
</script>
</body>
</html>
